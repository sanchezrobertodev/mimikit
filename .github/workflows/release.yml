name: Release

# Manual only: day-to-day checks run locally with `make check`.
# Builds the signed macOS (universal) and Linux bundles of one version and adds them, with their update-feed entries,
# to that version's release in this repo. Windows comes from `make release`; either can go first (see docs/releasing.md).
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, without the "v". Must match tauri.conf.json on the branch you run this from.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version }}

jobs:
  bundle:
    strategy:
      matrix:
        include:
          - os: macos-latest
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin --bundles app,dmg
          - os: ubuntu-22.04
            targets: ""
            args: --bundles appimage,deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Check the version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          actual=$(node -p 'require("./src-tauri/tauri.conf.json").version')
          if [ "$actual" != "$VERSION" ]; then
            echo "::error::tauri.conf.json on ${GITHUB_REF_NAME} is $actual, not $VERSION"
            exit 1
          fi
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build and sign for updates
        run: npx tauri build ${{ matrix.args }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Ad-hoc code signature, no Apple account: Apple Silicon won't run an app without one.
          APPLE_SIGNING_IDENTITY: "-"
      - uses: actions/upload-artifact@v7
        with:
          name: bundles-${{ runner.os }}
          path: |
            src-tauri/target/**/release/bundle/macos/*.app.tar.gz
            src-tauri/target/**/release/bundle/macos/*.app.tar.gz.sig
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/appimage/*.AppImage
            src-tauri/target/**/release/bundle/appimage/*.AppImage.sig
            src-tauri/target/**/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          pattern: bundles-*
          path: bundles
          merge-multiple: true
      - name: Add to the release
        run: node scripts/release.mjs --add-platforms bundles
        env:
          GH_TOKEN: ${{ github.token }}
