[package]
name = "mimikit"
version = "0.14.0"
description = "Browse, preview and tag the game assets in your folders"
authors = ["Roberto Sanchez"]
license = "MIT"
edition = "2024"

[lib]
# The `_lib` suffix avoids a lib/bin name clash on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mimikit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-drag = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled", "backup"] }
walkdir = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tga", "tiff", "ico", "dds", "exr", "hdr", "qoi"] }
psd = "0.3"
notify-debouncer-full = "0.7"
blake3 = "1"
trash = "5"
tokio = { version = "1", features = ["sync", "rt", "net", "io-util", "time"] }
# `mimikit mcp`, the relay agent apps start: the official MCP SDK, on stdio.
rmcp = { version = "3.8", default-features = false, features = ["server", "transport-io"] }
# The agent bridge's random token, and the data folder the relay finds it in.
getrandom = "0.3"
dirs = "7"
# Header probing for the audio extensions in kind.rs (Opus has no Symphonia support), and AIFF decoding (`pcm`): the
# webview can't play AIFF, so audio.rs converts it to WAV.
symphonia = { version = "0.6", default-features = false, features = ["wav", "aiff", "pcm", "ogg", "mp3", "flac", "isomp4", "aac", "id3v2"] }
# Aseprite cels and gzip-compressed .blend files (Blender 2.x). Already in the build through `image`.
flate2 = "1"
# zstd-compressed .blend files (Blender 3.0+). Pure Rust, decoding only; no other crates without the default features.
ruzstd = { version = "0.9", default-features = false, features = ["std"] }
# Low OS priority for background passes (image analysis, duplicate hashing, audio headers).
thread-priority = "3"
# The user's Anthropic API key, in the OS credential store (Windows Credential Manager, macOS Keychain, Secret Service).
keyring = "4.2"
# Claude API calls (ai.rs). Already in the build through the updater: the same version and TLS, so no new crates.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
# The TLS crypto reqwest uses, installed by ai.rs before the first request (the updater may not have yet). Already in
# the build through reqwest, with this feature.
rustls = { version = "0.23", default-features = false, features = ["ring"] }
# Pictures in Suggest tags' requests (tagging.rs). Already in the build through Tauri.
base64 = "0.22"
# Search by meaning (meaning.rs): ONNX Runtime, loaded at run time from the library downloaded with the model, so the
# installer doesn't grow and nothing is downloaded at build time. A release candidate, so the version is pinned.
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic", "api-17"] }
# The downloaded model and runtime files are checked against hashes in meaning.rs. Already in the build through Tauri.
sha2 = "0.10"

# Whether an agent's relay is still running (bridge.rs `relays_alive`), and whether the Visual C++ runtime ONNX Runtime
# needs is installed (meaning.rs `vc_runtime`). Both were already in the build through Tauri.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
# An MCP client for the relay's tests.
rmcp = { version = "3.8", default-features = false, features = ["client"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
